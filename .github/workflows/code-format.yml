name: Check code format

on: [push, pull_request]

jobs:
  uncrustify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Uncrustify
        run: sudo apt-get update && sudo apt-get install -y uncrustify

      - name: Check C, C++, and Arduino sketch formatting
        run: |
          git ls-files -z -- \
            ':(glob)src/**/*.c' ':(glob)src/**/*.h' \
            ':(glob)src/**/*.cpp' ':(glob)src/**/*.ino' \
            ':(glob)examples/**/*.c' ':(glob)examples/**/*.h' \
            ':(glob)examples/**/*.cpp' ':(glob)examples/**/*.ino' \
            ':(exclude,glob)src/unity/**' |
            xargs -0 uncrustify -c uncrustify.cfg --check